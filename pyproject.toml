[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mazegen"
version = "1.0.0"
description = "A reusable maze generation package with support for perfect and non-perfect mazes"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "abdothma, ralrawaj", email = "anon@none.com"}
]
keywords = ["maze", "generation", "algorithm", "perfect-maze", "recursive-backtracker"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Games/Entertainment",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/Rashed-Alrwajbeh0/42-A-Maze-ing"
Repository = "https://github.com/Rashed-Alrwajbeh0/42-A-Maze-ing.git"
Issues = "https://github.com/Rashed-Alrwajbeh0/42-A-Maze-ing/issues"

[tool.setuptools]
packages = ["MazeGenerator"]

[tool.setuptools.package-data]
MazeGenerator = []

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_ignores = true
ignore_missing_imports = true
disallow_untyped_defs = true
check_untyped_defs = true

[tool.flake8]
max-line-length = 100
extend-ignore = ["E203", "W503"]
exclude = [".git", "__pycache__", "dist", "build", ".eggs", "*.egg-info"]
