[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mazegen"
version = "1.0.0"
description = "A reusable maze generation package with support for perfect and non-perfect mazes"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    {name = "abdothma, ralrawaj", email = "anon@none.com"}
]
dependencies = []

[tool.setuptools]
packages = ["MazeGenerator"]

[tool.setuptools.package-data]
MazeGenerator = []
